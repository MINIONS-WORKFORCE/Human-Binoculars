openapi: 3.1.0
info:
  title: SPHEREx Sky Viewer MVP API
  version: '1.0'
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/targets:
    get:
      summary: Targets
      operationId: targets_api_targets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MVPTarget'
                type: array
                title: Response Targets Api Targets Get
  /api/frames:
    get:
      summary: Frames
      operationId: frames_api_frames_get
      parameters:
      - name: s_ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          title: S Ra
      - name: s_dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: S Dec
      - name: obs_collection
        in: query
        required: true
        schema:
          enum:
          - spherex_dr1
          - spherex_qr2
          - spherex_qr3
          type: string
          title: Obs Collection
      - name: t_min
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: T Min
      - name: t_max
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: T Max
      - name: energy_bandpassname
        in: query
        required: true
        schema:
          enum:
          - SPHEREx-D1
          - SPHEREx-D2
          - SPHEREx-D3
          - SPHEREx-D4
          - SPHEREx-D5
          - SPHEREx-D6
          type: string
          title: Energy Bandpassname
      - name: cutout_size_deg
        in: query
        required: true
        schema:
          type: number
          maximum: 0.2
          exclusiveMinimum: 0
          title: Cutout Size Deg
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MVPFrames'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
  /files/{path}:
    get:
      summary: Image
      operationId: image_files__path__get
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            image/png: {}
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DifferenceFrame:
      properties:
        frame_id:
          type: string
          title: Frame Id
        image_url:
          type: string
          title: Image Url
        later_frame_id:
          type: string
          title: Later Frame Id
        earlier_frame_id:
          type: string
          title: Earlier Frame Id
        warnings:
          items:
            $ref: '#/components/schemas/WarningMessage'
          type: array
          title: Warnings
      additionalProperties: false
      type: object
      required:
      - frame_id
      - image_url
      - later_frame_id
      - earlier_frame_id
      - warnings
      title: DifferenceFrame
    Display:
      properties:
        stretch:
          type: string
          const: asinh
          title: Stretch
        vmin:
          type: number
          title: Vmin
        vmax:
          type: number
          title: Vmax
        unit:
          type: string
          const: MJy/sr
          title: Unit
      additionalProperties: false
      type: object
      required:
      - stretch
      - vmin
      - vmax
      - unit
      title: Display
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        fields:
          items:
            type: string
          type: array
          title: Fields
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - fields
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
    Grid:
      properties:
        projection:
          type: string
          const: TAN
          title: Projection
        center_ra_deg:
          type: number
          title: Center Ra Deg
        center_dec_deg:
          type: number
          title: Center Dec Deg
        pixel_scale_arcsec:
          type: number
          exclusiveMinimum: 0.0
          title: Pixel Scale Arcsec
        width_px:
          type: integer
          exclusiveMinimum: 0.0
          title: Width Px
        height_px:
          type: integer
          exclusiveMinimum: 0.0
          title: Height Px
      additionalProperties: false
      type: object
      required:
      - projection
      - center_ra_deg
      - center_dec_deg
      - pixel_scale_arcsec
      - width_px
      - height_px
      title: Grid
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MVPFrame:
      properties:
        frame_id:
          type: string
          title: Frame Id
        image_url:
          type: string
          title: Image Url
        t_min:
          type: number
          title: T Min
        t_max:
          type: number
          title: T Max
        observation_time:
          type: string
          title: Observation Time
        energy_bandpassname:
          type: string
          enum:
          - SPHEREx-D1
          - SPHEREx-D2
          - SPHEREx-D3
          - SPHEREx-D4
          - SPHEREx-D5
          - SPHEREx-D6
          title: Energy Bandpassname
        obs_collection:
          type: string
          enum:
          - spherex_qr2
          - spherex_qr2_deep
          - spherex_qr3
          - spherex_qr3_deep
          title: Obs Collection
        n_images:
          type: integer
          title: N Images
        source_obs_publisher_dids:
          items:
            type: string
          type: array
          title: Source Obs Publisher Dids
        warnings:
          items:
            $ref: '#/components/schemas/WarningMessage'
          type: array
          title: Warnings
        visit_index:
          type: integer
          minimum: 0.0
          title: Visit Index
        visit_label:
          type: string
          title: Visit Label
      additionalProperties: false
      type: object
      required:
      - frame_id
      - image_url
      - t_min
      - t_max
      - observation_time
      - energy_bandpassname
      - obs_collection
      - n_images
      - source_obs_publisher_dids
      - warnings
      - visit_index
      - visit_label
      title: MVPFrame
    MVPFrames:
      properties:
        data_kind:
          type: string
          enum:
          - mock
          - observational
          title: Data Kind
        query:
          $ref: '#/components/schemas/MVPQuery'
        grid:
          $ref: '#/components/schemas/Grid'
        display:
          anyOf:
          - $ref: '#/components/schemas/Display'
          - type: 'null'
        frames:
          items:
            $ref: '#/components/schemas/MVPFrame'
          type: array
          title: Frames
        difference_frames:
          items:
            $ref: '#/components/schemas/DifferenceFrame'
          type: array
          title: Difference Frames
        sources:
          items:
            $ref: '#/components/schemas/MVPSource'
          type: array
          title: Sources
        warnings:
          items:
            $ref: '#/components/schemas/WarningMessage'
          type: array
          title: Warnings
      additionalProperties: false
      type: object
      required:
      - data_kind
      - query
      - grid
      - display
      - frames
      - sources
      - warnings
      title: MVPFrames
    MVPQuery:
      properties:
        s_ra:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: S Ra
        s_dec:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: S Dec
        obs_collection:
          type: string
          enum:
          - spherex_dr1
          - spherex_qr2
          - spherex_qr3
          title: Obs Collection
        t_min:
          anyOf:
          - type: number
          - type: 'null'
          title: T Min
        t_max:
          anyOf:
          - type: number
          - type: 'null'
          title: T Max
        energy_bandpassname:
          type: string
          enum:
          - SPHEREx-D1
          - SPHEREx-D2
          - SPHEREx-D3
          - SPHEREx-D4
          - SPHEREx-D5
          - SPHEREx-D6
          title: Energy Bandpassname
        cutout_size_deg:
          type: number
          maximum: 0.2
          exclusiveMinimum: 0.0
          title: Cutout Size Deg
      additionalProperties: false
      type: object
      required:
      - s_ra
      - s_dec
      - obs_collection
      - energy_bandpassname
      - cutout_size_deg
      title: MVPQuery
    MVPSource:
      properties:
        obs_id:
          type: string
          title: Obs Id
        obs_publisher_did:
          type: string
          title: Obs Publisher Did
        obs_collection:
          type: string
          enum:
          - spherex_qr2
          - spherex_qr2_deep
          - spherex_qr3
          - spherex_qr3_deep
          title: Obs Collection
        energy_bandpassname:
          type: string
          enum:
          - SPHEREx-D1
          - SPHEREx-D2
          - SPHEREx-D3
          - SPHEREx-D4
          - SPHEREx-D5
          - SPHEREx-D6
          title: Energy Bandpassname
        s_ra:
          anyOf:
          - type: number
          - type: 'null'
          title: S Ra
        s_dec:
          anyOf:
          - type: number
          - type: 'null'
          title: S Dec
        t_min:
          type: number
          title: T Min
        t_max:
          type: number
          title: T Max
        access_url:
          type: string
          title: Access Url
        access_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Format
        s_region:
          anyOf:
          - type: string
          - type: 'null'
          title: S Region
        s_fov:
          anyOf:
          - type: number
          - type: 'null'
          title: S Fov
        em_min:
          anyOf:
          - type: number
          - type: 'null'
          title: Em Min
        em_max:
          anyOf:
          - type: number
          - type: 'null'
          title: Em Max
      additionalProperties: false
      type: object
      required:
      - obs_id
      - obs_publisher_did
      - obs_collection
      - energy_bandpassname
      - t_min
      - t_max
      - access_url
      title: MVPSource
    MVPTarget:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        object_type:
          type: string
          title: Object Type
        ra_deg:
          type: number
          title: Ra Deg
        dec_deg:
          type: number
          title: Dec Deg
        epoch_jyear:
          type: number
          title: Epoch Jyear
        default_detector:
          type: integer
          maximum: 6.0
          minimum: 1.0
          title: Default Detector
        default_fov_arcmin:
          type: number
          maximum: 12.0
          exclusiveMinimum: 0.0
          title: Default Fov Arcmin
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - object_type
      - ra_deg
      - dec_deg
      - epoch_jyear
      - default_detector
      - default_fov_arcmin
      title: MVPTarget
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WarningMessage:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: WarningMessage
