name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-samples:
    name: API samples match backend models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # Only what the validator imports, at the versions pinned in requirements.txt.
      - name: Install validator dependencies
        run: |
          grep -E '^(fastapi|pillow)==' requirements.txt > "$RUNNER_TEMP/validator-requirements.txt"
          pip install -r "$RUNNER_TEMP/validator-requirements.txt"

      - name: Validate api_samples/ with Pydantic models
        run: python members/dong/scripts/validate_api_samples.py

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Fails when openapi.yaml changed but src/api/schema.d.ts was not regenerated.
      - name: Generated API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/schema.d.ts

      - run: npm run lint
      - run: npm run typecheck

      # Includes the api_samples/ schema check against openapi.yaml (src/mocks/samples.test.ts).
      - run: npm test

      - run: npm run build

  e2e:
    name: Playwright end-to-end (mock build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # playwright.config.ts builds with `--mode mock` and serves it with vite preview.
      - run: npm run e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  members-js:
    name: Shared and member JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
