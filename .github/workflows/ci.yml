name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: Detect branch components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [[ -f frontend/package-lock.json ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TARGET_BRANCH" == main || -d frontend ]]; then
            echo "Frontend lockfile is missing" >&2
            exit 1
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: Python pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_MODE: fixture
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest members -q

  api-samples:
    name: API samples match backend models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # Only what the validator imports, at the versions pinned in requirements.txt.
      - name: Install validator dependencies
        run: |
          grep -E '^(fastapi|pillow)==' requirements.txt > "$RUNNER_TEMP/validator-requirements.txt"
          pip install -r "$RUNNER_TEMP/validator-requirements.txt"

      - name: Validate api_samples/ with Pydantic models
        run: python members/dong/scripts/validate_api_samples.py

  frontend:
    name: Frontend lint, types, tests, build
    needs: layout
    if: needs.layout.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Fails when openapi.yaml changed but src/api/schema.d.ts was not regenerated.
      - name: Generated API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/schema.d.ts

      - run: npm run lint
      - run: npm run typecheck

      # Includes the api_samples/ schema check against openapi.yaml (src/mocks/samples.test.ts).
      - run: npm test

      - run: npm run build

  e2e:
    name: Playwright end-to-end (mock build)
    needs: layout
    if: needs.layout.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # playwright.config.ts builds with `--mode mock` and serves it with vite preview.
      - run: npm run e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  members-js:
    name: Shared and member JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test

  delivery:
    name: Package verified build
    needs: [layout, python, api-samples, frontend, e2e, members-js]
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
          needs.layout.result == 'success' &&
          needs.python.result == 'success' &&
          needs.api-samples.result == 'success' &&
          needs.members-js.result == 'success' &&
          ((needs.layout.outputs.frontend == 'true' &&
            needs.frontend.result == 'success' && needs.e2e.result == 'success') ||
           (needs.layout.outputs.frontend == 'false' &&
            needs.frontend.result == 'skipped' && needs.e2e.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Package backend from tracked runtime files
        run: |
          mkdir delivery
          git archive --format=tar.gz --output=delivery/backend.tar.gz HEAD \
            .python-version requirements.txt api_samples shared \
            members/dong/app members/huu-hoang/tan_pipeline.py
      - uses: actions/setup-node@v5
        if: needs.layout.outputs.frontend == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and package frontend
        if: needs.layout.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          tar -czf ../delivery/frontend.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: spherex-build-${{ github.sha }}
          path: delivery/*.tar.gz
          if-no-files-found: error
          retention-days: 14
